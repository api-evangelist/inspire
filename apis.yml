description: Inspire (Inspire Clean Energy) is a consumer clean-energy company on a mission
  to transform the way people access clean energy and accelerate a net-zero carbon future.
  It gives residential customers access to renewable energy for their home electricity
  supply through flat-rate subscription plans designed to deliver predictability and reduce
  exposure to electricity rate volatility. Surfaced as a portfolio company of Obvious Ventures
  and added to the API Evangelist network; enrichment found no public API, developer portal,
  documentation, or OpenAPI surface — this is a non-API consumer brand.
